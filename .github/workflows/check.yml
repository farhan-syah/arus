name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Load the pinned toolchain
        run: rustup show
      - name: Check the scaffold
        run: sh scripts/check.sh --online
