# Manual distribution workflow for the ARUS workspace.
# Push a v* tag first; `Release Prepare` checks the tag and runs the full suite.
# Then dispatch this workflow with that tag to publish crates in topological order
# and create the GitHub Release.
#
# Required secret: CARGO_REGISTRY_TOKEN, readable from environment `crates-io`.

name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true
        type: string
      publish_crate:
        description: "Publish ARUS workspace crates to crates.io"
        type: boolean
        default: true
      github_release:
        description: "Create the GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    uses: ./.github/workflows/release-validate.yml
    with:
      ref: ${{ inputs.tag }}

  publish-crate:
    name: Publish workspace to crates.io
    needs: validate-version
    if: inputs.publish_crate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Set version from tag
        run: bash scripts/ci/stamp_version.sh "${{ needs.validate-version.outputs.version }}"

      - name: Publish ARUS crates in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"

          is_published() {
            curl -sf \
              -H "User-Agent: arus-ci (github.com/farhan-syah/arus)" \
              "https://crates.io/api/v1/crates/$1/$2" > /dev/null 2>&1
          }

          wait_indexed() {
            local crate="$1"
            for i in $(seq 1 30); do
              if is_published "$crate" "$VERSION"; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Timed out waiting for $crate@$VERSION on crates.io"
            exit 1
          }

          publish_one() {
            local crate="$1"
            if is_published "$crate" "$VERSION"; then
              echo "$crate@$VERSION already published, skipping"
              return 0
            fi
            for attempt in $(seq 1 10); do
              echo "Publishing $crate@$VERSION (attempt $attempt)..."
              set +e
              out=$(cargo publish -p "$crate" --allow-dirty 2>&1)
              rc=$?
              set -e
              echo "$out"
              if [[ "$rc" -eq 0 ]]; then
                wait_indexed "$crate"
                return 0
              fi
              if echo "$out" | grep -q "429 Too Many Requests"; then
                retry_at=$(echo "$out" | sed -n 's/.*Please try again after \([^.]*GMT\).*/\1/p' | head -n 1)
                wait_s=615
                if [[ -n "$retry_at" ]]; then
                  target_ts=$(date -u -d "$retry_at" +%s 2>/dev/null || echo 0)
                  now_ts=$(date -u +%s)
                  if (( target_ts > now_ts )); then
                    wait_s=$(( target_ts - now_ts + 10 ))
                  fi
                fi
                echo "Rate-limited by crates.io for $crate; sleeping ${wait_s}s until ${retry_at:-next window}..."
                sleep "$wait_s"
              else
                echo "::error::Failed to publish $crate@$VERSION"
                exit "$rc"
              fi
            done
            echo "::error::Exceeded rate-limit retries for $crate@$VERSION"
            exit 1
          }

          for crate in \
            arus-domain \
            arus-media \
            arus-api-types \
            arus-assets \
            arus-geo \
            arus-model-api \
            arus-storage \
            arus-web \
            arus-evaluation \
            arus-hydrology \
            arus-ingest \
            arus-jobs \
            arus-ml \
            arus-scenarios \
            arus-cli \
            arus-forecasting \
            arus-hydraulics \
            arus-optimisation \
            arus \
            arus-api \
            arus-worker
          do
            publish_one "$crate"
          done

  github-release:
    name: Create GitHub Release
    needs: validate-version
    if: inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Extract changelog section
        run: bash scripts/ci/changelog_section.sh "${{ needs.validate-version.outputs.base_version }}" /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          IS_FULL: ${{ needs.validate-version.outputs.is_full_release }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$IS_FULL" != "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" --title "arus $TAG" --notes-file /tmp/release-notes.md "${FLAGS[@]}"
          fi
