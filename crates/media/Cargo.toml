[package]
name = "arus-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Video and media encoding utilities built on vidr for ARUS flood visualizations."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
png-encode = ["dep:containr", "dep:png"]

[dependencies]
containr = { version = "0.1.1", default-features = false, features = ["mp4"], optional = true }
numr15 = { package = "numr", version = "0.15.2", default-features = false }
png = { version = "0.18", optional = true }
tempfile.workspace = true
vidr.workspace = true

[lints]
workspace = true
