[workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/web",
    "apps/worker",
    "crates/api-types",
    "crates/assets",
    "crates/domain",
    "crates/evaluation",
    "crates/forecasting",
    "crates/geo",
    "crates/hydraulics",
    "crates/hydrology",
    "crates/ingest",
    "crates/jobs",
    "crates/ml",
    "crates/model-api",
    "crates/optimisation",
    "crates/scenarios",
    "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
arus-api-types = { path = "crates/api-types" }
arus-assets = { path = "crates/assets" }
arus-domain = { path = "crates/domain" }
arus-evaluation = { path = "crates/evaluation" }
arus-forecasting = { path = "crates/forecasting" }
arus-geo = { path = "crates/geo" }
arus-hydraulics = { path = "crates/hydraulics" }
arus-hydrology = { path = "crates/hydrology" }
arus-ingest = { path = "crates/ingest" }
arus-jobs = { path = "crates/jobs" }
arus-ml = { path = "crates/ml" }
arus-model-api = { path = "crates/model-api" }
arus-optimisation = { path = "crates/optimisation" }
arus-scenarios = { path = "crates/scenarios" }
arus-storage = { path = "crates/storage" }
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
hydr = "0.1.0"
numr = { version = "0.16.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
