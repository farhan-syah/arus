[workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/web",
    "apps/worker",
    "crates/api-types",
    "crates/assets",
    "crates/domain",
    "crates/evaluation",
    "crates/forecasting",
    "crates/geo",
    "crates/hydraulics",
    "crates/hydrology",
    "crates/ingest",
    "crates/jobs",
    "crates/media",
    "crates/ml",
    "crates/model-api",
    "crates/optimisation",
    "crates/scenarios",
    "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
arus-api-types = { path = "crates/api-types" }
arus-assets = { path = "crates/assets" }
arus-domain = { path = "crates/domain" }
arus-evaluation = { path = "crates/evaluation" }
arus-forecasting = { path = "crates/forecasting" }
arus-geo = { path = "crates/geo" }
arus-hydraulics = { path = "crates/hydraulics" }
arus-hydrology = { path = "crates/hydrology" }
arus-ingest = { path = "crates/ingest" }
arus-jobs = { path = "crates/jobs" }
arus-media = { path = "crates/media" }
arus-ml = { path = "crates/ml" }
arus-model-api = { path = "crates/model-api" }
arus-optimisation = { path = "crates/optimisation" }
arus-scenarios = { path = "crates/scenarios" }
arus-storage = { path = "crates/storage" }
arus-web = { path = "apps/web" }
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "0.7"
fs2 = "0.4.3"
hydr = "0.2.0"
nodedb-client = "0.6.2"
nodedb-lite = { version = "0.1.0", default-features = false }
numr = { version = "0.16.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
vidr = { version = "0.1.1", features = ["cpu-vp9", "openh264", "mkv", "mp4", "pipeline"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
